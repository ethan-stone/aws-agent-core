<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentCore Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f9fafb; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1f2937; color: white; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    .config { padding: 16px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; gap: 12px; align-items: end; }
    .config label { font-size: 13px; color: #374151; font-weight: 500; }
    .config input { display: block; margin-top: 4px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 100%; }
    .config .field { flex: 1; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #2563eb; color: white; }
    .msg.agent { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; }
    .msg.error { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .msg.auth { align-self: flex-start; background: #fffbeb; border: 1px solid #fde68a; }
    .msg.auth a { color: #92400e; font-weight: 600; }
    .input-area { padding: 16px 24px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 12px; }
    .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
    .input-area input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .input-area button { padding: 10px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
    .input-area button:hover { background: #1d4ed8; }
    .input-area button:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>AgentCore Chat</header>

  <div class="config">
    <div class="field">
      <label for="token">Cognito Access Token</label>
      <input id="token" type="password" placeholder="Paste your access token here">
    </div>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <input id="prompt" type="text" placeholder="Type a message... (use 'introspect' for identity flow)" autofocus>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');

    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
    });

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addHtmlMessage(html, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const token = document.getElementById('token').value.trim();
      const prompt = promptEl.value.trim();

      if (!token) { alert('Please enter your Cognito access token'); return; }
      if (!prompt) return;

      addMessage(prompt, 'user');
      promptEl.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify({ prompt }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          addMessage('Error: ' + (err.error || res.statusText), 'error');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // Parse SSE events from the buffer
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith(':')) continue;

            // Try to parse as JSON event
            try {
              const evt = JSON.parse(trimmed);
              if (evt.event === 'auth_url') {
                addHtmlMessage(
                  'Authorization required. <a href="' + evt.data.authUrl + '" target="_blank">Click here to authenticate</a>',
                  'auth'
                );
              } else if (evt.event === 'token_claims') {
                addMessage('Token claims:\n' + JSON.stringify(evt.data.claims, null, 2), 'agent');
              } else if (evt.event === 'message') {
                addMessage(evt.data.text, 'agent');
              } else if (evt.event === 'error') {
                addMessage('Error: ' + (evt.data.message || JSON.stringify(evt.data)), 'error');
              } else {
                addMessage(JSON.stringify(evt, null, 2), 'agent');
              }
            } catch {
              // Not JSON, display raw
              if (trimmed) addMessage(trimmed, 'agent');
            }
          }
        }

        // Handle remaining buffer
        if (buffer.trim()) {
          try {
            const evt = JSON.parse(buffer.trim());
            if (evt.event === 'auth_url') {
              addHtmlMessage(
                'Authorization required. <a href="' + evt.data.authUrl + '" target="_blank">Click here to authenticate</a>',
                'auth'
              );
            } else if (evt.event === 'token_claims') {
              addMessage('Token claims:\n' + JSON.stringify(evt.data.claims, null, 2), 'agent');
            } else if (evt.event === 'message') {
              addMessage(evt.data.text, 'agent');
            } else if (evt.event === 'error') {
              addMessage('Error: ' + (evt.data.message || JSON.stringify(evt.data)), 'error');
            } else {
              addMessage(JSON.stringify(evt, null, 2), 'agent');
            }
          } catch {
            if (buffer.trim()) addMessage(buffer.trim(), 'agent');
          }
        }
      } catch (err) {
        addMessage('Network error: ' + err.message, 'error');
      } finally {
        sendBtn.disabled = false;
        promptEl.focus();
      }
    }
  </script>
</body>
</html>
